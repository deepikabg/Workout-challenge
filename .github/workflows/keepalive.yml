name: keep-alive
# D-019: one read a week so the free Supabase project never auto-pauses. Read-only, public key only.
on:
  schedule:
    - cron: '17 14 * * 1'   # Mondays 14:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one workout id
        env:
          URL: https://xuabtbdhpdlsrljjjdyc.supabase.co
          KEY: sb_publishable_sNZ2-8u1nVXJNOdS5SNPOQ_-ULQuSiL   # publishable key — public by design
        run: |
          body=$(curl -fsS "$URL/rest/v1/workouts?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Response: $body"
          case "$body" in \[*) echo "Supabase is awake." ;; *) echo "Unexpected response"; exit 1 ;; esac
