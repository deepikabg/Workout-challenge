name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secret scan (G-05)
        run: node scripts/secret-scan.mjs
      - name: Unit + fixture tests (C-01..C-15)
        env:
          TZ: UTC   # rules must not depend on the machine's time zone
        run: npm test
